name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux x86_64 (build + tests + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: ./run_tests.sh
      - name: Test with AddressSanitizer / UBSan
        run: |
          make debug
          CPY=./bin/cpy-asan ASAN_OPTIONS=detect_leaks=0 ./run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cpy-linux-x86_64
          path: bin/cpy

  linux-arm64:
    name: Linux arm64 (build + tests)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ./run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cpy-linux-arm64
          path: bin/cpy

  termux-arm64:
    name: Android arm64 (Termux) via NDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile with the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          make CC="$CC"
          file bin/cpy
      - uses: actions/upload-artifact@v4
        with:
          name: cpy-termux-arm64
          path: bin/cpy

  release:
    name: Attach binaries to tagged releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-arm64, termux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Rename
        run: |
          for d in cpy-*; do mv "$d/cpy" "$d.bin"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: cpy-*.bin
